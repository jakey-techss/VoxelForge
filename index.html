<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoxelForge</title>

    <link rel="stylesheet" href="index.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<body>

    <div id="app">


        <!-- TOP BAR -->
        <header class="topbar">

            <div class="logo">
                <span class="logo-icon">⬢</span>
                VoxelForge
            </div>


            <div class="toolbar">

                <a target="_blank" href="index.html"><button id="newWorld">
                        New World
                    </button></a>

                <button id="saveWorld">
                    Save
                </button>

                <button id="exportModel">
                    Export Fabrication
                </button>

            </div>

        </header>



        <!-- MAIN WORKSPACE -->
        <main class="workspace">


            <!-- LEFT INVENTORY -->
            <aside class="inventory-panel">


                <h2>
                    Inventory
                </h2>


                <div class="inventory-grid" id="inventory">


                    <div class="item selected" data-block="grass">

                        <img src="textures/grassInven.webp">

                    </div>


                    <div class="item" data-block="dirt">

                        <img src="textures/dirtInven.webp">

                    </div>


                    <div class="item" data-block="stone">

                        <img src="textures/stoneInven.webp">

                    </div>


                    <div class="item" data-block="wood">

                        <img src="textures/woodInven.webp">

                    </div>


                    <div class="item" data-block="planks">

                        <img src="textures/woodPlankInven.webp">

                    </div>


                    <div class="item" data-block="glass">

                        <img src="textures/glassInven.webp">

                    </div>


                    <div class="item" data-block="brick">

                        <img src="textures/BrickInve.png">

                    </div>


                    <div class="item" data-block="metal">

                        <img src="textures/IronInven.webp">

                    </div>



                </div>


                <div class="inventory-info">

                    Selected:
                    <span id="selectedBlock">
                        Grass
                    </span>

                </div>


            </aside>





            <!-- 3D VIEW -->
            <section class="viewport">
                <button id="home-button">⌂</button>
                <div id="three-container"></div>
                <div id="view-cube"></div>




            </section>






            <!-- RIGHT PANEL -->
            <aside class="properties-panel">


                <h2>
                    Build Info
                </h2>



                <div class="stat">

                    Blocks Required:

                    <span id="blockCount">
                        0
                    </span>

                </div>



            </aside>


        </main>




        <!-- BOTTOM STATUS BAR -->
        <footer class="statusbar">


            <div>
                VoxelForge Engine
            </div>


            <div id="status">

                Connecting To Printer...

            </div>


        </footer>


    </div>


    <div id="build-alert">

        <div class="alert-icon">
            ⚠
        </div>

        <div>
            <strong>
                Cannot Build Here
            </strong>

            <p>
                Outside safe build zone
            </p>
        </div>

    </div>
<div id="printOverlay" class="print-overlay hidden">

    <div class="print-window">

        <div class="voxel-loader">
            <div class="cube"></div>
        </div>

        <h2>Printing Model</h2>

        <p id="loadingMessage">
            Preparing build...
        </p>

        <div class="progress-container">
            <div id="progressBar"></div>
        </div>

        <div class="print-info">

            <div>
                <span>Progress</span>
                <strong id="progressPercent">0%</strong>
            </div>

            <div>
                <span>Estimated Remaining</span>
                <strong id="remainingTime">--:--</strong>
            </div>

        </div>
        
        <button id="cancelPrint">
            Cancel
        </button>

    </div>

</div>

    <script src="index.js"></script>

</body>

</html>
